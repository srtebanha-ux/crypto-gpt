name: Probe Morpho Base Indexer (Read-only)
on:
  push:
    branches: [feat/ranking-morpho-graphql-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/probeMorphoGraphql.cjs
      - name: Unit-test grouping by chain and unique log event
        run: node --test scripts/rankearMorphoIndexado.test.cjs
      - name: Rank all Morpho Blue liquidators on Base over last seven days
        run: node scripts/rankearMorphoIndexado.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-morpho-base-leaderboard
          path: .tmp/rankingMorphoBaseIndexado.json
          if-no-files-found: warn
          retention-days: 14
