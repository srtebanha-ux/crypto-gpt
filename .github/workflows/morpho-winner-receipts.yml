name: Morpho Winner Transaction Receipts
on:
  push:
    branches: [feat/forense-vencedor-morpho-base-20261018]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Investigate known winning Morpho receipts and token flows
        run: node scripts/forenseRecibosMorphoBase.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpho-winner-receipts
          path: .tmp/forenseMorphoVencedor.json
          if-no-files-found: ignore
          retention-days: 14
