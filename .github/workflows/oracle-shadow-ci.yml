name: Oracle Shadow CI
on:
  pull_request:
    branches:
      - feat/caca-integracao-multihop-ativa
  push:
    branches:
      - feat/caca-oracle-shadow-20261017
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --require ts-node/register --test src/oracleShadow.test.ts src/precoDeMercado.test.ts
      - run: npm run build
