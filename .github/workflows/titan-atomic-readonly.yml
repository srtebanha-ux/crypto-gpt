name: TITAN Atomic Live Quote Read-only

on:
  push:
    branches:
      - feat/titan-validacao-atomica-live
      - feat/titan-cacador-unificado-20261018
      - feat/titan-painel-tempo-real-20261018
      - fix/titan-quote-throughput-20261018
      - fix/titan-v2-runtime-solc-compat-20261018
      - fix/titan-v2-skip-taxed-tokens-20261018
      - fix/titan-v2-atomic-preflight-20261018
      - fix/titan-weth-gas-selection-20261018
      - fix/titan-atomica-funil-real-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile production executor and observer
        run: npm run build
      - name: Generate FlashArb read-only EVM artifact
        run: node scripts/gerarProvaFlashArb.cjs
      - name: Offline atomic economic checks - no wallet or broadcast
        run: node --require ts-node/register --test src/titanExecucao.test.ts src/janelaDeNonce.test.ts src/titanExplorador.test.ts src/titanTriangulos.test.ts src/titanTaticas.test.ts src/titanV2Prova.test.ts src/titanV2Selecao.test.ts src/titanSelecaoGas.test.ts src/titanPriorizacao.test.ts src/titanPainel.test.ts
      - name: No second signer enabled by the validation flag
        run: |
          node -e "const fs=require('fs');let s=fs.readFileSync('src/cacarArbitragem.ts','utf8');if(!s.includes('TITAN_VALIDAR_AO_VIVO')||!s.includes('simularTitanAoVivo'))process.exit(1)"
