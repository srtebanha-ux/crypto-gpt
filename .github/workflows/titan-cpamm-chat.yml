name: TITAN CPAMM atomic integration (CHAT)
on:
  pull_request:
    branches: [CHAT]
    paths:
      - 'src/titanCpammAtomico.ts'
      - 'src/titanCpammAtomico.test.ts'
      - 'src/dexArbitrageSniffer.ts'
      - 'src/dexArbitrageSniffer.test.ts'
      - 'src/ammMath.ts'
      - 'src/ammMath.test.ts'
      - '.github/workflows/titan-cpamm-chat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: TS full suite, bounded concurrency
        run: node --require ts-node/register --test --test-concurrency=2 src/*.test.ts
