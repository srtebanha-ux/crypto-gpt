name: Megazord readiness regressions
on:
  pull_request:
    branches: [CHAT, main]
    paths:
      - 'src/megazord*'
      - 'package*.json'
      - '.github/workflows/megazord-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Offline wallet, RPC, boot and executor regressions
        run: node --require ts-node/register --test src/megazord*.test.ts
