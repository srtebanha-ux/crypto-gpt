name: Reverse Engineering Base Liquidators / Read-only
on:
  push:
    branches:
      - feat/inspecao-liquidadores-base-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe proxy, implementation and verified ABI on Base
        run: node scripts/inspecionarLiquidadoresBase.cjs
