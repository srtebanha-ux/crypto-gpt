name: TITAN RPC quota and atomic probe throughput
on:
  push:
    branches: [codex/rpc-throughput-20261023]
  pull_request:
    branches: [feat/megazord-unified-observation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Quotas, cache expiry, live transport, ownership and financial gates
        run: >-
          node --require ts-node/register --test --test-concurrency=2
          src/rpcCoordenado.test.ts src/transporteRpc.test.ts
          src/titanVazao.test.ts src/escadaDeRpc.test.ts
          src/titanExecucao.test.ts src/titanIdentidadeSonda.test.ts
          src/titanPriorizacao.test.ts src/titanV2Prova.test.ts
          src/megazord.test.ts src/megazordExecutor.test.ts
