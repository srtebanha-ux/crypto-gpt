name: Base Morpho Liquidator Transaction Forensics
on:
  push:
    branches:
      - feat/forense-vencedor-morpho-base-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/forenseLiquidacoesVencedorBase.cjs
