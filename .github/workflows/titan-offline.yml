name: Titan offline checks

on:
  push:
    branches:
      - claude/morpho-auditoria-rest
      - feat/titan-multihop-execution-bridge
  pull_request:
    branches:
      - claude/morpho-auditoria-rest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx hardhat compile
      - name: Morpho flash loan local (sem fork e sem transacao real)
        run: npx hardhat test --config hardhat.morpho-local.cjs forkTests/morphoCreditoLocal.js
      - name: Aave Morpho multi-hop completo, somente mocks locais
        run: npx hardhat test --config hardhat.morpho-local.cjs forkTests/titanMultiHopLocal.js
      - name: Aave FlashSwap direto em EVM local (sem envio na Base)
        run: npx hardhat test --config hardhat.morpho-local.cjs forkTests/aaveDirectFlashSwapLocal.js
      - name: Compilar variacao TSTORE TLOAD Cancun isolada
        run: npx hardhat compile --config hardhat.titan-cancun.cjs
      - name: Comparar gas da liquidacao Cancun contra baseline
        run: npx hardhat test --no-compile --config hardhat.titan-cancun.cjs forkTests/aaveTransientLocal.js
      - name: Gate e limitadores sem RPC externo
        run: node --require ts-node/register --test src/titanExecucao.test.ts src/titanVazao.test.ts src/titanPriorizacao.test.ts src/titanAutorizacaoContinua.test.ts src/titanEscolherFonte.test.ts src/titanFlashblocks.test.ts src/titanSplitRoute.test.ts src/titanOtimizadorTamanho.test.ts src/titanRotasLiquidacao.test.ts src/titanPlanejadorLiquidacao.test.ts src/titanPonteMultiHop.test.ts
