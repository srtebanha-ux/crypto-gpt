name: CACA Small Debts CI
on:
  push:
    branches:
      - feat/caca-fechamento-posicoes-pequenas
  pull_request:
    branches:
      - feat/caca-integracao-multihop-ativa
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --require ts-node/register --test src/cacaFechamentoPequenos.test.ts src/residuo.test.ts src/precoDeMercado.test.ts
      - run: npm run build
