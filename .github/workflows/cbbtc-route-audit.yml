name: Cacador cbBTC route audit (read-only)
on:
  push:
    branches: [feat/cbbtc-aave-safe-20261017]
permissions:
  contents: read
jobs:
  cb-btc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Inspect verified factories and live cbBTC target without private keys
        run: |
          node <<'JS'
          const {Interface}=require('ethers');
          const url='https://mainnet.base.org';
          const aave='0xA238Dd80C259a72e81d7e4664a9801593F98d1c5';
          const debtor='0x03d0a5c9e1843986fb2f9335f7eb936754f7eaf0';
          const cbbtc='0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf';
          const weth='0x4200000000000000000000000000000000000006';
          const usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const uni='0x33128a8fC17869897dcE68Ed026d694621f6FDfD';
          const slip='0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A';
          async function rpc(method,params){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),9000);try{
            const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,
              body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();
            if(j.error)throw Error(JSON.stringify(j.error));return j.result;
          }finally{clearTimeout(t)}}
          const IF=new Interface([
            'function getPool(address,address,uint24) view returns(address)',
            'function getUserAccountData(address) view returns(uint256,uint256,uint256,uint256,uint256,uint256)',
            'function token0() view returns(address)',
            'function token1() view returns(address)',
            'function fee() view returns(uint24)',
            'function tickSpacing() view returns(int24)',
            'function liquidity() view returns(uint128)',
            'function slot0() view returns(uint160,int24,uint16,uint16,uint16,uint8,bool)'
          ]);
          const SL=new Interface(['function getPool(address,address,int24) view returns(address)']);
          async function call(to,abi,key,args=[]){const data=abi.encodeFunctionData(key,args);
            const result=await rpc('eth_call',[{to,data},'latest']);
            return abi.decodeFunctionResult(key,result);}
          (async()=>{
            const block=await rpc('eth_blockNumber',[]);console.log('BASE_BLOCK '+parseInt(block,16));
            const acc=await call(aave,IF,'getUserAccountData',[debtor]);
            console.log('ALVO1_ACCOUNT '+JSON.stringify({collateralUSD8:String(acc[0]),debtUSD8:String(acc[1]),
              availableBorrowsUSD8:String(acc[2]),thresholdBps:String(acc[4]),healthFactor:String(acc[5])}));
            for(const [a,b] of [[cbbtc,usdc],[cbbtc,weth]]){
              for(const fee of [100,500,3000,10000]){
                const pool=(await call(uni,IF,'getPool',[a,b,fee]))[0];
                if(pool==='0x0000000000000000000000000000000000000000')continue;
                let entry={dex:'uniswap-v3',pair:[a,b],fee,pool};
                try{
                  const [token0,token1,liquidity]=await Promise.all([
                    call(pool,IF,'token0'),call(pool,IF,'token1'),call(pool,IF,'liquidity')]);
                  Object.assign(entry,{token0:token0[0],token1:token1[0],liquidity:String(liquidity[0])});
                }catch(e){entry.error=String(e).slice(0,170)}
                console.log('POOL '+JSON.stringify(entry));
              }
            }
            for(const sp of [1,10,50,100,200,300]){
              let pool;
              try { pool=(await call(slip,SL,'getPool',[cbbtc,usdc,sp]))[0]; }
              catch(e){console.log('POOL_SKIPPED '+JSON.stringify({tickSpacing:sp,reason:String(e).slice(0,120)}));continue;}
              if(pool==='0x0000000000000000000000000000000000000000')continue;
              let entry={dex:'slipstream',pair:[cbbtc,usdc],tickSpacing:sp,pool};
              try{
                const [t0,t1,ts,liq]=await Promise.all([
                  call(pool,IF,'token0'),call(pool,IF,'token1'),
                  call(pool,IF,'tickSpacing'),call(pool,IF,'liquidity')]);
                Object.assign(entry,{token0:t0[0],token1:t1[0],onchainSpacing:String(ts[0]),liquidity:String(liq[0])});
              }catch(e){entry.error=String(e).slice(0,170)}
              console.log('POOL '+JSON.stringify(entry));
            }
          })().catch(e=>{console.error('AUDIT_FATAL',String(e));process.exitCode=1});
          JS
