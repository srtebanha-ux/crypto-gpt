name: CACA Ordered Targets CI
on:
  push:
    branches:
      - feat/caca-ordenacao-liquidaveis-20261017
  pull_request:
    branches:
      - feat/caca-integracao-multihop-ativa
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --require ts-node/register --test src/cacaOrdenarCaidos.test.ts src/cacaPrioridadeBrasa.test.ts src/cacaFechamentoPequenos.test.ts src/cacaFeedDaAave.test.ts src/cacaRotaAerodrome.test.ts src/cacaQuoteAerodrome.test.ts src/cacaSlipstream.test.ts src/cacaModosV2.test.ts src/cacaV1Pool.test.ts
      - run: npm run build
